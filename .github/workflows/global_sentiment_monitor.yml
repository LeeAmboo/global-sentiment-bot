name: Global Sentiment Monitor

on:
  # 定时触发：北京时间每天 06:00（UTC 22:00）
  schedule:
    - cron: '00 22 * * *'

  # 手动触发：允许在 Actions 页面点击 Run workflow
  workflow_dispatch:

# 关键：允许 GITHUB_TOKEN 读取和写入仓库内容
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. 检查运行环境
      - name: Show files
        run: |
          echo "当前目录："
          pwd
          echo "仓库文件："
          ls -la
          echo "工作流文件："
          ls -la .github/workflows || true
          echo "当前分支：$GITHUB_REF_NAME"
          echo "当前仓库：$GITHUB_REPOSITORY"

      # 3. 配置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 4. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 5. 检查文件及语法
      - name: Check Python files
        run: |
          echo "检查 main.py..."
          test -f main.py

          echo "检查 requirements.txt..."
          test -f requirements.txt

          echo "检查 Python 版本..."
          python --version

          echo "检查 main.py 语法..."
          python -m py_compile main.py

          echo "检查核心依赖..."
          python -c "import requests, yfinance, akshare, pandas, numpy, fear_greed; print('核心依赖导入成功')"

      # 6. 运行监控程序
      - name: Run Monitor Script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: GFI_Strategy

          # 关键：供 main.py 通过 GitHub Contents API 保存历史记录
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 以下两个变量由 GitHub Actions 自动提供
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "开始运行全球市场情绪监控..."
          python main.py
          echo "监控程序运行结束。"
